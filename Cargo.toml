[dev-dependencies]
mockall = "0.14"
pretty_assertions = "1"
rstest = "0.26"

[workspace]
members = [".", "crates/s14_project_structure", "crates/s21_wordle", "crates/s28_axum_api"]

# Allow clippy lints that conflict with the educational purpose of example files.
# These examples intentionally demonstrate patterns like vec![], while let on iterators,
# explicit lifetimes, literal unwraps, &Vec params, approximate constants, etc.
# In a learning repo, the "non-idiomatic" code IS the lesson.
[lints.clippy]
approx_constant = "allow"
box_collection = "allow"
collapsible_if = "allow"
const_is_empty = "allow"
drop_non_drop = "allow"
empty_line_after_doc_comments = "allow"
eq_op = "allow"
get_first = "allow"
inconsistent_digit_grouping = "allow"
into_iter_on_ref = "allow"
iter_cloned_collect = "allow"
iter_count = "allow"
iter_nth = "allow"
let_and_return = "allow"
manual_contains = "allow"
manual_is_multiple_of = "allow"
manual_range_patterns = "allow"
match_like_matches_macro = "allow"
needless_lifetimes = "allow"
needless_question_mark = "allow"
needless_range_loop = "allow"
nonminimal_bool = "allow"
or_fun_call = "allow"
print_literal = "allow"
ptr_arg = "allow"
question_mark = "allow"
redundant_closure = "allow"
redundant_closure_call = "allow"
result_filter_map = "allow"
reversed_empty_ranges = "allow"
single_char_add_str = "allow"
single_match = "allow"
suspicious_open_options = "allow"
unnecessary_fold = "allow"
unnecessary_lazy_evaluations = "allow"
unnecessary_literal_unwrap = "allow"
useless_format = "allow"
useless_vec = "allow"
vec_init_then_push = "allow"
while_let_loop = "allow"
while_let_on_iterator = "allow"
zero_divided_by_zero = "allow"
